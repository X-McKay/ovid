# Declared infrastructure for the fixture: the same services its workload
# probes dynamically, plus one it never touches (declared-only).
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "2525:2525"
