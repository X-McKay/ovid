# Runner recipe: JVM builds (Maven and Gradle wrappers preferred).
api_version: ovid.dev/pack/v1
kind: runner-recipe
metadata:
  name: java
  version: 1.0.0
  license: Apache-2.0
  signer: ovid-builtin
detect:
  any_files: [pom.xml, build.gradle, build.gradle.kts]
commands:
  build:
    - [./mvnw, -B, -DskipTests, package]
    - [mvn, -B, -DskipTests, package]
    - [./gradlew, assemble]
  test:
    - [./mvnw, -B, test]
    - [mvn, -B, test]
    - [./gradlew, test]
required_tools: [java]
